# SCRATCH (a-crash-40144-bsmith, never lands): #40144 red/green on Blacksmith macOS while the owned fleet is down.
name: Terminal hang diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watchdog-thunks:
    name: "#40144 ${{ matrix.side }}"
    runs-on: blacksmith-6vcpu-macos-26
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - side: red
            ref: 1674afdc8af8742f0d7c61ec3baaa8fc3b2840f1
            filter: "MainThreadWatchdogTests"
          - side: green
            ref: ee2606ff6f6ae850525f251efaac8a27553cceea
            filter: "MainThreadWatchdogTests|MutexClosureLoadTests"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
          submodules: false
          fetch-depth: 1
      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.22.1"
      - name: Source key of the web bundles
        id: web-bundle-key
        run: echo "key=$(python3 scripts/cmux-next/web-bundle-key.py . --source)" >> "$GITHUB_OUTPUT"
      - name: Restore the web bundles from R2
        id: web-bundle-r2
        uses: ./.github/actions/cache-restore
        env:
          CI_CACHE_R2_PUBLIC_URL: https://ci-cache-next.cmux.com
          CI_CACHE_R2_NAMESPACE: any
        with:
          backend: r2
          path: web-bundles-out
          key: cmux-next-web-bundles-v1-${{ steps.web-bundle-key.outputs.key }}
      - name: Install the restored web bundles
        if: steps.web-bundle-r2.outputs.cache-hit == 'true'
        run: scripts/cmux-next/build-web-bundles.sh --from web-bundles-out
      - name: Build the web bundles
        if: steps.web-bundle-r2.outputs.cache-hit != 'true'
        run: scripts/cmux-next/build-web-bundles.sh
      - name: Build package and tests
        working-directory: Packages/macOS/CmuxNext
        run: swift build --build-tests
      - name: Run the suites
        working-directory: Packages/macOS/CmuxNext
        run: swift test --skip-build --filter '${{ matrix.filter }}' 2>&1 | tee "$RUNNER_TEMP/test.log"; exit ${PIPESTATUS[0]}
      - name: Summary
        if: always()
        run: grep -E "Test run with|✘|stack depth grew|onStallStays|readingOnHang|loadingAClosure" "$RUNNER_TEMP/test.log" | tail -20 || true
